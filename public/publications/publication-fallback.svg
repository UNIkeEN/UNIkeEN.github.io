<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-labelledby="title">
  <title id="title">Publication thumbnail placeholder</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    .background-start { stop-color: #eef2ff; }
    .background-end { stop-color: #ecfeff; }
    .accent-start { stop-color: #6366f1; }
    .accent-end { stop-color: #0891b2; }
    .paper { fill: #ffffff; }
    .paper-behind { fill: #f8fafc; stroke: #c7d2fe; }
    .ink { fill: #475569; }
    .ink-muted { stroke: #94a3b8; }
    .dot { fill: #64748b; }

    @media (prefers-color-scheme: dark) {
      .background-start { stop-color: #111827; }
      .background-end { stop-color: #10252b; }
      .accent-start { stop-color: #818cf8; }
      .accent-end { stop-color: #22d3ee; }
      .paper { fill: #1f2937; }
      .paper-behind { fill: #172033; stroke: #48567a; }
      .ink { fill: #cbd5e1; }
      .ink-muted { stroke: #7f8da3; }
      .dot { fill: #94a3b8; }
    }
  </style>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop class="background-start"/>
      <stop class="background-end" offset="1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop class="accent-start"/>
      <stop class="accent-end" offset="1"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle class="dot" cx="3" cy="3" r="1.5" opacity=".2"/>
    </pattern>
  </defs>

  <rect x="-1" y="-1" width="722" height="542" fill="url(#background)"/>
  <rect x="-1" y="-1" width="722" height="542" fill="url(#dots)"/>

  <g transform="translate(82 112)">
    <rect class="paper-behind" x="30" y="28" width="202" height="258" rx="18" stroke-width="4"/>
    <rect class="paper" width="202" height="258" rx="18" stroke="url(#accent)" stroke-width="6"/>
    <path class="ink-muted" d="M45 67h110M45 101h81M45 176l31-34 28 25 49-66" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"/>
    <circle cx="154" cy="101" r="11" fill="url(#accent)"/>
  </g>

  <g class="ink">
    <rect x="366" y="150" width="270" height="20" rx="10"/>
    <rect x="366" y="198" width="218" height="14" rx="7" opacity=".62"/>
    <rect x="366" y="234" width="246" height="14" rx="7" opacity=".62"/>
    <rect x="366" y="270" width="190" height="14" rx="7" opacity=".62"/>
    <rect x="366" y="326" width="112" height="34" rx="17" fill="url(#accent)"/>
    <rect x="494" y="326" width="88" height="34" rx="17" opacity=".22"/>
  </g>
</svg>
